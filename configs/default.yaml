app:
  name: YomuTube
  version: "0.1.0"

paths:
  archive_dir: "data/archives"
  work_dir: "data/work"
  model_dir: "data/models"
  cache_dir: "data/cache"

ytdlp:
  no_playlist: true
  max_height: 1080
  format: "bv*[height<=1080][vcodec*=avc1]+ba[ext=m4a]/bv*[height<=1080][vcodec!*=av01]+ba/b[height<=1080][vcodec!*=av01]/b[height<=1080]/b"
  write_info_json: true
  write_description: true
  write_thumbnail: true
  subtitle_languages:
    - "ja.*"
    - "en.*"
  exclude_subtitle_languages:
    - "live_chat"
  subtitle_formats:
    - "vtt"
    - "json3"
    - "ttml"
    - "srv3"
    - "best"
  cookies_file: null
  user_agent: null
  retries: 5
  sleep_interval_sec: 1

subtitles:
  enabled: true
  policy: prefer_manual
  fallback_to_auto: false
  min_coverage_ratio: 0.25
  min_coverage_ratio_for_available: 0.25
  min_coverage_ratio_for_primary: 0.85
  normalize:
    unicode: NFKC
    remove_music_notes: true
    collapse_whitespace: true

media:
  audio_sample_rate: 16000
  audio_channels: 1
  audio_codec: pcm_s16le
  frame_backend: opencv
  scene_change_detection: true
  max_video_height_for_ocr: 1080

asr:
  enabled: true
  when: no_good_subtitle
  good_subtitle_coverage_ratio: 0.85
  engine: faster-whisper
  model: large-v3
  device: cuda
  strict_device: false
  compute_type: int8_float16
  batch_size: 8
  beam_size: 5
  vad_filter: true
  word_timestamps: false
  language: auto
  initial_prompt: null

archive:
  write_quality_report: true
  write_effective_config: true
  write_words: true
  write_speaker_turns: true
  write_alignment: true
  write_conflicts: true
  write_topics: true
  write_entities: true
  write_visual_text: true
  write_failed_archive: true

ocr:
  enabled: false
  primary_engine: tesseract
  fallback_engine: paddleocr
  languages:
    - ja
    - en
  frame_sampling:
    subtitle_roi_fps: 0.1
    full_frame_interval_sec: 10
    scene_change_threshold: 0.35
  regions:
    - name: bottom_caption
      role: caption
      enabled: true
      x: 0.05
      y: 0.68
      w: 0.90
      h: 0.28
      preprocess:
        upscale: 2.0
        grayscale: true
        denoise: true
        threshold: adaptive
    - name: full_frame
      role: slide
      enabled: false
      x: 0.00
      y: 0.00
      w: 1.00
      h: 1.00
      preprocess:
        upscale: 1.0
        grayscale: false
        denoise: false
        threshold: none
  dedupe:
    similarity_threshold: 0.86
    min_confidence: 0.45
    min_duration_ms: 400

diarization:
  enabled: false
  engine: pyannote
  model: "pyannote/speaker-diarization-community-1"
  fallback_engine: local_cluster
  device: cuda
  min_speakers: null
  max_speakers: null
  hf_token_env: HF_TOKEN
  local_cluster:
    num_speakers: 2
    window_ms: 2000
    hop_ms: 1000
    min_segment_ms: 500

fusion:
  primary_text_priority:
    - manual_subtitle
    - asr
    - auto_subtitle
  ocr_display_policy: separate_if_not_duplicate
  duplicate_similarity_threshold: 0.82
  overlap_threshold: 0.50
  merge_gap_ms: 700
  max_segment_chars: 180

markdown:
  include_frontmatter: true
  include_metadata_section: true
  include_source_links: true
  include_ocr_events: true
  include_confidence: false
  timestamp_format: "HH:MM:SS.mmm"
  youtube_timestamp_links: true

performance:
  gpu_jobs: 1
  cpu_workers: 4
  ocr_workers: 2
  ffmpeg_threads: 4

storage:
  keep_temp_media: false
  keep_debug_frames: false
  keep_raw_subtitle_files: true

runtime:
  resume: true
  rerun_policy: reuse_done
  if_running: fail

modes:
  quick:
    subtitles:
      enabled: true
    asr:
      when: no_good_subtitle
      model: small
    ocr:
      enabled: false
  standard:
    subtitles:
      enabled: true
    asr:
      when: no_good_subtitle
      model: large-v3
    ocr:
      enabled: false
  full:
    subtitles:
      enabled: true
    asr:
      when: always
      model: large-v3
    ocr:
      enabled: true
    diagnostics:
      keep_conflicts: true

network:
  allow_model_download: true
  allow_cloud_api: false

compliance:
  delete_temp_video_after_success: true
  redact_infojson_fields:
    - requested_formats
    - formats
    - thumbnails
    - automatic_captions
    - subtitles
    - http_headers
    - cookies
